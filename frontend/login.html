<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestIQ AI - Login/Register</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <!-- 左侧背景装饰 -->
        <div class="auth-background">
            <div class="background-shape shape1"></div>
            <div class="background-shape shape2"></div>
            <h2>Welcome to InvestIQ AI</h2>
            <p>Your AI-powered investment platform that delivers intelligent market analysis and adaptive investment strategies to grow your wealth.</p>
        </div>

        <!-- 右侧登录/注册表单 -->
        <div class="auth-form-container">
            <!-- Logo和标题 -->
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-chart-pie"></i>
                    <h1>InvestIQ AI</h1>
                </div>
                <p class="auth-subtitle">AI-Powered Investment Intelligence Platform</p>
            </div>

            <!-- 登录表单 -->
            <div id="login-form" class="auth-form active">
                <h2>登录账户</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="login-username" name="username" placeholder="请输入您的用户名" autocomplete="username" required>
                        </div>
                        <span class="error-message" id="login-username-error"></span>
                    </div>
                  
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-password" name="password" placeholder="请输入您的密码" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" title="显示/隐藏密码">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="login-password-error"></span>
                    </div>
                  
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="remember-me">
                            <span class="checkmark"></span>
                            记住我
                        </label>
                        <a href="#" onclick="handleForgotPassword(); return false;" class="forgot-password">忘记密码？</a>
                    </div>
                  
                    <button type="submit" class="btn-primary auth-btn">
                        <span class="btn-text">登录</span>
                        <div class="btn-loader" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </button>
                </form>
                
                <!-- 测试按钮 -->
              
                <div class="auth-footer">
                    <p>还没有账户？<a href="#" onclick="showRegisterForm(); return false;" class="register-link">立即注册</a></p>
                </div>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" class="auth-form">
                <h2>创建账户</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="register-username">用户名</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="register-username" name="username" placeholder="请输入用户名" autocomplete="username" required>
                        </div>
                        <span class="error-message" id="register-username-error"></span>
                    </div>
                  
                    <div class="form-group">
                        <label for="register-email">邮箱地址</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="register-email" name="email" placeholder="请输入您的邮箱" autocomplete="email" required>
                        </div>
                        <span class="error-message" id="register-email-error"></span>
                    </div>
                  
                    <div class="form-group">
                        <label for="register-password">密码</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="register-password" name="password" placeholder="请输入密码（至少8位）" autocomplete="new-password" required>
                            <button type="button" class="toggle-password" title="显示/隐藏密码">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="register-password-error"></span>
                    </div>
                  
                    <div class="form-group">
                        <label for="register-confirm-password">确认密码</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="register-confirm-password" name="confirmPassword" placeholder="请再次输入密码" autocomplete="new-password" required>
                            <button type="button" class="toggle-password" title="显示/隐藏密码">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="register-confirm-password-error"></span>
                    </div>
                  
                    <div class="form-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="agree-terms" required>
                            <span class="checkmark"></span>
                            我已阅读并同意<a href="#" class="terms-link">服务条款</a>和<a href="#" class="privacy-link">隐私政策</a>
                        </label>
                    </div>
                  
                    <button type="submit" class="btn-primary auth-btn">
                        <span class="btn-text">注册</span>
                        <div class="btn-loader" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                        </div>
                    </button>
                </form>
              
                <div class="auth-footer">
                    <p>已有账户？<a href="#" onclick="showLoginForm(); return false;" class="login-link">立即登录</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="notification" class="notification">
        <div class="notification-content">
            <i class="fas fa-check-circle"></i>
            <span id="notification-message"></span>
        </div>
    </div>

    <!-- 引入auth.js -->
    <script type="module" src="auth.js"></script>
    <script>
        // 全局函数定义（用于HTML中的onclick事件）
        function showRegisterForm() {
            console.log('显示注册表单被调用');
            document.getElementById('login-form').classList.remove('active');
            document.getElementById('register-form').classList.add('active');
            clearAllErrors();
        }
      
        function showLoginForm() {
            console.log('显示登录表单被调用');
            document.getElementById('register-form').classList.remove('active');
            document.getElementById('login-form').classList.add('active');
            clearAllErrors();
        }
      
      
        function handleForgotPassword() {
            const modal = document.createElement('div');
            modal.className = 'forgot-password-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>重置密码</h3>
                        <button class="modal-close" onclick="this.closest('.forgot-password-modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p>请输入您的邮箱地址，我们将向您发送密码重置链接。</p>
                        <div class="form-group">
                            <label for="reset-email">邮箱地址</label>
                            <div class="input-group">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="reset-email" placeholder="请输入您的邮箱" autocomplete="email" required>
                            </div>
                            <span class="error-message" id="reset-email-error"></span>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="this.closest('.forgot-password-modal').remove()">取消</button>
                        <button type="button" class="btn-primary" onclick="sendResetEmail()">发送重置链接</button>
                    </div>
                </div>
                <div class="modal-backdrop" onclick="this.closest('.forgot-password-modal').remove()"></div>
            `;
          
            document.body.appendChild(modal);
        }
      
        function sendResetEmail() {
            const email = document.getElementById('reset-email').value.trim();
            const errorElement = document.getElementById('reset-email-error');
          
            errorElement.textContent = '';
          
            if (!email) {
                errorElement.textContent = '请输入邮箱地址';
                return;
            }
          
            if (!isValidEmail(email)) {
                errorElement.textContent = '请输入有效的邮箱地址';
                return;
            }
          
            document.querySelector('.forgot-password-modal').remove();
            showNotification('密码重置链接已发送到您的邮箱，请查收', 'success');
        }
      
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
      
        function clearAllErrors() {
            const errorElements = document.querySelectorAll('.error-message');
            errorElements.forEach(element => {
                element.textContent = '';
            });
        }
      
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            const messageElement = document.getElementById('notification-message');
            const icon = notification.querySelector('i');
          
            messageElement.textContent = message;
            notification.className = `notification ${type}`;
            icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
          
            notification.classList.add('show');
          
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
      
        // 检查登录状态
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn === 'true') {
                window.location.href = 'index.html';
            }
        }
      
        // 页面加载时检查登录状态
        checkLoginStatus();
    </script>
</body>
</html>
