server:
  port: 8081

spring:
  application:
    name: finance-dashboard
  datasource:
    url: jdbc:mysql://localhost:3306/finance_db?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver


mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:financeDashboardJwtSecretKey2024ForTokenGenerationAndValidationThisIsASecureKeyWithEnoughLengthForHMACSHA256Algorithm}
  expiration: 604800 # 7天，单位秒

# 新浪财经API配置
sina:
  api:
    base-url: https://hq.sinajs.cn
    timeout: 5000  # 超时时间(毫秒)
    retry-times: 3  # 重试次数
    batch-size: 50  # 批量查询最大数量
  scheduler:
    enabled: false  # 是否启用定时任务，初期设为false，测试通过后再开启
    realtime-cron: "0 */1 9-15 * * MON-FRI"  # 交易日9:30-15:00每分钟执行
    history-cron: "0 0 16 * * MON-FRI"  # 每天16:00同步历史数据