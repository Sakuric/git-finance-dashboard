server:
  port: 8888

spring:
  application:
    name: finance-config
  cloud:
    config:
      server:
        git:
          # 配置文件存储的Git仓库地址
          uri: https://github.com/finance-platform/config-repo
          # 搜索路径
          search-paths: '{application}'
          # 默认分支
          default-label: main
          # 强制拉取
          force-pull: true
          # 超时时间
          timeout: 10
          # 克隆目录
          basedir: /tmp/config-repo
          # 用户名和密码（如果是私有仓库）
          # username: 
          # password:
        # 健康检查
        health:
          repositories:
            finance-config:
              label: main
              name: finance-config
              profiles: dev,prod

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    metadata-map:
      management.context-path: /actuator
  
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    org.springframework.cloud.config: INFO
    org.springframework.cloud.config.server: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/finance-config.log
    max-size: 100MB
    max-history: 30

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    config:
      server:
        git:
          # 开发环境使用本地文件系统
          uri: file://${user.home}/finance-config-repo
          search-paths: '{application}'
          default-label: main

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    config:
      server:
        git:
          # 生产环境使用远程Git仓库
          uri: https://github.com/finance-platform/config-repo-prod
          search-paths: '{application}'
          default-label: main
          # 生产环境配置认证信息
          username: ${CONFIG_REPO_USERNAME:}
          password: ${CONFIG_REPO_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:admin123}@eureka-server:8761/eureka/

logging:
  level:
    org.springframework.cloud.config: WARN
    org.springframework.cloud.config.server: WARN